version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Scanner fixtures use package.json.fixture and are materialized only in disposable tests.
    # This exclusion is defense in depth; fixtures must never become dependency roots.
    exclude-paths:
      - "fixtures/**"
    ignore:
      # Keep compiler support aligned with typescript-eslint's declared peer range.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Keep ambient APIs within the package's declared Node.js 20/22/24 support matrix.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
