version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep compiler support aligned with typescript-eslint's declared peer range.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Keep ambient APIs within the package's declared Node.js 24 baseline.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
