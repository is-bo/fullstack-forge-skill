name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete verification
        run: npm run check
      - name: Fail on stale committed build output
        run: git diff --exit-code -- build/
      - name: Report test coverage
        run: npm run test:coverage
      - name: Audit locked dependencies
        run: npm audit --ignore-scripts
      - name: Build deterministic platform archives
        run: npm run package:platforms
      - name: Smoke-install the packed npm artifact
        run: npm run smoke:install
      - name: Verify development-preview update and uninstall
        run: npm run smoke:upgrade
      - name: Verify offline installation from bundled assets
        run: npm run offline:install
      - name: Upload release candidates
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fullstack-forge-dist
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/manifest.json
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
